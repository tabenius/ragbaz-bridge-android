plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.ragbaz.bridge'
    compileSdk 34
    defaultConfig {
        applicationId "com.ragbaz.bridge"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            // Both JNA artifacts carry these licenses; preserve them together.
            merges += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // OSHI: Open Source Hardware Instrumentation for system metrics
    implementation('com.github.oshi:oshi-core:6.9.3') {
        // Android needs JNA's native libraries from the AAR, not its desktop JAR.
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation('net.java.dev.jna:jna-platform:5.18.1') {
        exclude group: 'net.java.dev.jna', module: 'jna'
    }
}
